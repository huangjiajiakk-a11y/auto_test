# 登录接口测试数据
- case_name: "登录成功"
  steps:
    - name: "登录成功"
      method: "post"
      path: "/api/login"
      json:
        phone: "15377095676"
        password: "hjj123456."
      need_token: false
      expected_code: 200
      expected_fields:
        - "code"
        - "message"
        - "data"

- case_name: "密码错误"
  steps:
    - name: "密码错误"
      method: "post"
      path: "/api/login"
      json:
        phone: "15377095676"
        password: "wrongpassword"
      need_token: false
      expected_code: 400

- case_name: "手机号格式错误"
  steps:
    - name: "手机号格式错误"
      method: "post"
      path: "/api/login"
      json:
        phone: "123"
        password: "hjj123456."
      need_token: false
      expected_code: 400

- case_name: "手机号为空"
  steps:
    - name: "手机号为空"
      method: "post"
      path: "/api/login"
      json:
        phone: ""
        password: "hjj123456."
      need_token: false
      expected_code: 400

- case_name: "密码为空"
  steps:
    - name: "密码为空"
      method: "post"
      path: "/api/login"
      json:
        phone: "15377095676"
        password: ""
      need_token: false
      expected_code: 400
