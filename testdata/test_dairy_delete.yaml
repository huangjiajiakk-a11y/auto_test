# 删除日记接口测试数据
- case_name: "删除不存在的日记"
  method: "post"
  path: "/api/dairy/delete"
  params:
    diaryNum: 999999999
  need_token: true
  expected_code: 400
  expected_fields:
    - "code"
    - "message"

- case_name: "缺少diaryNum参数"
  method: "post"
  path: "/api/dairy/delete"
  need_token: true
  expected_code: 403

- case_name: "未登录删除日记"
  method: "post"
  path: "/api/dairy/delete"
  params:
    diaryNum: 1
  need_token: false
  expected_code: 403
