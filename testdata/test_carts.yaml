- case_name: "添加单个商品到购物车"
  method: "post"
  path: "/carts/add"
  json:
    userId: 1
    products:
      - id: 152
        quantity: 4
  need_token: false
  expected_code: 201
  expected_fields:
    - "id"
    - "products"
    - "total"
    - "userId"
    - "totalProducts"
    - "totalQuantity"

- case_name: "添加多个商品到购物车"
  method: "post"
  path: "/carts/add"
  json:
    userId: 1
    products:
      - id: 1
        quantity: 2
      - id: 50
        quantity: 1
  need_token: false
  expected_code: 201
  expected_fields:
    - "id"
    - "products"
    - "total"
    - "discountedTotal"
    - "totalProducts"
    - "totalQuantity"

- case_name: "缺少products字段"
  method: "post"
  path: "/carts/add"
  json:
    userId: 1
  need_token: false
  expected_code: 400
